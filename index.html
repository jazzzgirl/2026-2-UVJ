<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>프로젝트 상호평가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 상단 고정 헤더(오른쪽에 교수자 메뉴) 아래, 한 줄 폭 640~860px의 단일 컬럼 */
:root {
  --bg: #F3F5FA;
  --surface: #FFFFFF;
  --ink: #1B2240;
  --muted: #5B6482;
  --line: #DCE1EE;
  --soft: #E9EDF8;
  --primary: #1E2761;
  --primary-ink: #FFFFFF;
  --link: #2F4A94;
  --ok: #1D7447;
  --ok-soft: #E2F3EA;
  --warn: #9A4A12;
  --warn-soft: #FBEBDD;
  --danger: #B3261E;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-head: "Gowun Dodum", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1330; --surface: #171D42; --ink: #E8EBF9; --muted: #9FA8CC; --line: #2B3366;
    --soft: #222A59; --primary: #A5B6F7; --primary-ink: #0E1330; --link: #A5B6F7;
    --ok: #6FD0A0; --ok-soft: #173A2C; --warn: #F0B27F; --warn-soft: #3F2A17; --danger: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1330; --surface: #171D42; --ink: #E8EBF9; --muted: #9FA8CC; --line: #2B3366;
  --soft: #222A59; --primary: #A5B6F7; --primary-ink: #0E1330; --link: #A5B6F7;
  --ok: #6FD0A0; --ok-soft: #173A2C; --warn: #F0B27F; --warn-soft: #3F2A17; --danger: #FF8A80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 15px/1.65 var(--font-body);
  -webkit-text-size-adjust: 100%;
  word-break: keep-all; overflow-wrap: anywhere;
}
h1, h2, h3 { margin: 0; line-height: 1.35; text-wrap: balance; }
h1, h2 { font-family: var(--font-head); font-weight: 400; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.6rem, 4.5vw, 2.1rem); }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.02rem; font-weight: 700; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--link); }
:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }

/* 헤더 */
.hdr {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--primary); color: var(--primary-ink);
}
.hdr-in {
  max-width: 880px; margin: 0 auto; min-height: 56px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.brand { display: flex; flex-direction: column; line-height: 1.25; margin-right: auto; min-width: 0; }
.brand b { font-family: var(--font-head); font-weight: 400; font-size: 1.15rem; }
.brand span { font-size: 0.78rem; opacity: 0.8; }
.hdr-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.who { font-size: 0.85rem; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--primary-ink) 16%, transparent); }
.hbtn {
  border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 8px;
  padding: 6px 12px; font-size: 0.86rem; cursor: pointer; min-height: 36px;
}
.hbtn:hover { background: color-mix(in srgb, var(--primary-ink) 16%, transparent); }
.hbtn[aria-pressed="true"] { background: var(--primary-ink); color: var(--primary); }

/* 본문 */
main {
  max-width: 880px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1 1 0; min-width: 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 8px 14px; min-height: 40px; cursor: pointer; font-weight: 500;
}
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.primary:hover { filter: brightness(1.1); background: var(--primary); }
.btn.link { color: var(--link); }
.btn[disabled], .btn.off { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
.btn.small { min-height: 34px; padding: 4px 10px; font-size: 0.86rem; }
.badge { display: inline-block; font-size: 0.78rem; font-weight: 500; padding: 2px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }

/* 프로젝트 목록 */
.proj { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 18px; }
.proj .no { font-family: var(--font-head); font-size: 1.5rem; color: var(--link); min-width: 2.2rem; }
.proj.off { opacity: 0.6; }
.proj.off .no { color: var(--muted); }
@media (max-width: 520px) { .proj { grid-template-columns: auto 1fr; } .proj .btn, .proj .badge { grid-column: 1 / -1; justify-self: start; } }

/* 이름 선택 */
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.names button {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 14px 8px; cursor: pointer;
  font-weight: 500; min-height: 52px;
}
.names button:hover { border-color: var(--primary); background: var(--soft); }
input[type="text"], input[type="password"], input[type="search"], input[type="url"], textarea, select {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; min-height: 42px;
}
textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
label.lab { display: block; font-weight: 500; margin-bottom: 6px; }

/* 탭 */
.tabs { display: flex; gap: 4px; overflow-x: auto; overflow-y: hidden; border-bottom: 1px solid var(--line); margin-bottom: 20px; scrollbar-width: thin; }
.tab {
  flex: 0 0 auto; border: 0; background: transparent; padding: 11px 14px; cursor: pointer; color: var(--muted); font-weight: 500;
  border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--primary); font-weight: 700; }
.tab .cnt { font-size: 0.8rem; margin-left: 4px; color: var(--muted); }

/* 진행 상황 */
.prog { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.prog div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.prog b { display: block; font-size: 1.25rem; font-family: var(--font-head); font-weight: 400; }
.prog span { font-size: 0.82rem; color: var(--muted); }
@media (max-width: 520px) { .prog { grid-template-columns: 1fr; } }

/* 평가 양식 */
.q { border: 0; padding: 0; margin: 0; min-width: 0; }
.q legend { padding: 0; font-weight: 500; margin-bottom: 8px; }
.q.missing legend { color: var(--danger); }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale label { display: block; }
.scale input { position: absolute; opacity: 0; pointer-events: none; }
.scale span {
  display: block; text-align: center; padding: 10px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  cursor: pointer; font-weight: 500; font-variant-numeric: tabular-nums;
}
.scale label:hover span { border-color: var(--primary); }
.scale input:checked + span { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.scale input:focus-visible + span { outline: 3px solid var(--link); outline-offset: 2px; }
.ends { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
.cmt.missing textarea { border-color: var(--danger); }
.count { font-size: 0.8rem; color: var(--muted); text-align: right; margin-top: 4px; }
.count.ok { color: var(--ok); }
.err { color: var(--danger); font-size: 0.9rem; min-height: 1.4em; }

/* 피드백 */
.bar { display: grid; grid-template-columns: minmax(0, 1fr) 150px 44px; gap: 12px; align-items: center; }
.bar .track { height: 10px; background: var(--soft); border-radius: 999px; overflow: hidden; }
.bar .fill { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
.bar .val { text-align: right; font-weight: 700; }
@media (max-width: 560px) { .bar { grid-template-columns: 1fr 44px; } .bar .track { grid-column: 1 / -1; order: 3; } }
.big { font-family: var(--font-head); font-size: 2.6rem; line-height: 1; }
.quote { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; white-space: pre-wrap; }
.lock { text-align: center; padding: 40px 16px; }
.lock b { font-family: var(--font-head); font-weight: 400; font-size: 1.15rem; display: block; margin-bottom: 6px; }

/* 표 */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-weight: 700; color: var(--muted); font-size: 0.82rem; white-space: nowrap; }
td input { min-width: 180px; }

/* 스위치 */
.switch { display: inline-flex; align-items: center; gap: 12px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; }
.switch .sw { width: 52px; height: 30px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.switch .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch input:checked + .sw { background: var(--ok); }
.switch input:checked + .sw::after { transform: translateX(22px); }
.switch input:focus-visible + .sw { outline: 3px solid var(--link); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .switch .sw, .switch .sw::after { transition: none; } }

/* 모달·알림 */
.ovl { position: fixed; inset: 0; background: rgba(10, 14, 36, 0.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.modal { background: var(--surface); border-radius: 14px; padding: 22px; width: 100%; max-width: 400px; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--primary); color: var(--primary-ink); padding: 10px 18px; border-radius: 999px; font-weight: 500; max-width: calc(100vw - 32px);
}
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 12px 14px; }
.back { background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; font-weight: 500; align-self: flex-start; text-align: left; }
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-in">
    <div class="brand"><b>U튜브와 VJ실습</b><span id="crumb">프로젝트 상호평가</span></div>
    <div class="hdr-right" id="hdrRight"></div>
  </div>
</header>
<main id="app"></main>
<div id="layer"></div>
<noscript><main>이 페이지는 JavaScript가 필요합니다.</main></noscript>

<script>
/* ===== 설정: Apps Script 웹 앱 배포 후 받은 주소를 아래에 붙여 넣으세요 ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbwVnyTv1lEwv9NdYCSQAJJZcgav9lqvncw8LwF7xGNu2FQTiQV_TGzil1owHpsDJwdZTA/exec";

/* ===== 평가 항목 (Code.gs의 CRITERIA_COUNT와 항목 수가 같아야 합니다) ===== */
const FORMS = {
  cross: {
    title: "다른 팀 평가",
    items: [
      "콘셉트와 타깃 시청자가 분명하다",
      "벤치마킹 요소를 영상에 잘 녹여냈다",
      "롱폼의 구성과 톤앤매너가 일관되다",
      "숏폼의 초반 1~2초가 시선을 끈다",
      "엔딩 크레딧에 제작자·출연자·음악 정보가 빠짐없이 들어갔다",
      "발표가 시간 안에 명확하게 전달되었다"
    ],
    c1: { label: "가장 인상 깊었던 장면과 그 이유", ph: "어떤 장면이 왜 기억에 남았는지 적어 주세요." },
    c2: { label: "더 나아졌으면 하는 점 (개선 제안)", ph: "비난보다 개선 제안의 형태로 적어 주세요." }
  },
  self: {
    title: "우리 팀 자기 평가",
    items: [
      "우리 팀 영상은 기획한 콘셉트를 잘 전달했다",
      "롱폼과 숏폼이 한 팀의 영상임을 알아볼 수 있다",
      "나는 맡은 역할을 충실히 수행했다",
      "나는 기획 단계에서 아이디어를 적극적으로 냈다",
      "나는 제작 중 어려움을 스스로 해결하려고 노력했다",
      "나는 지난 시간 분석 내용을 영상에 반영했다"
    ],
    c1: { label: "이번 프로젝트에서 새로 배운 점", ph: "제작 과정에서 배운 것을 구체적으로 적어 주세요." },
    c2: { label: "다음에 개선하고 싶은 점", ph: "다음 프로젝트에서 다르게 해 보고 싶은 것을 적어 주세요." }
  },
  peer: {
    title: "팀 내 상호 평가",
    items: [
      "맡은 역할을 책임감 있게 수행했다",
      "회의와 제작 일정에 성실히 참여했다",
      "아이디어를 적극적으로 내고 상대의 의견을 존중했다",
      "협업과 소통이 원활했다",
      "최종 결과물에 기여한 정도"
    ],
    c1: { label: "고마웠던 점", ph: "함께 작업하며 도움이 된 점을 적어 주세요." },
    c2: { label: "아쉬웠던 점", ph: "다음 협업에 도움이 되도록 구체적으로 적어 주세요." }
  }
};
FORMS.prof = FORMS.cross;

/* ===== 상태 ===== */
const S = { view: "projects", pw: "", students: [], auth: null, data: null, tab: "cross", form: null, fb: null,
  prof: { pw: "", data: null, tab: "urls", form: null }, prevView: "projects" };

const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { /* 저장 불가 */ } return null; }
function safeUrl(u) { try { const x = new URL(String(u)); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch (e) { return ""; } }

async function api(action, payload = {}) {
  if (!API_URL) throw new Error("서버 주소(API_URL)가 아직 설정되지 않았습니다. README의 설치 순서를 확인해 주세요.");
  let res;
  try { res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action, ...payload }) }); }
  catch (e) { throw new Error("서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요."); }
  let data;
  try { data = await res.json(); } catch (e) { throw new Error("서버 응답을 읽지 못했습니다."); }
  if (!data.ok) throw new Error(data.error || "요청에 실패했습니다.");
  return data;
}
const sAuth = () => ({ pw: S.pw, id: S.auth.id, sid: S.auth.sid });

function toast(msg) {
  const old = $(".toast"); if (old) old.remove();
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

/* ===== 모달 ===== */
function modal({ title, desc, label, type = "password", inputmode, submit = "확인", onSubmit }) {
  const layer = $("#layer");
  layer.innerHTML = `<div class="ovl" id="ovl"><form class="modal stack" id="mf" autocomplete="off">
    <h2 style="font-size:1.15rem">${esc(title)}</h2>
    ${desc ? `<p class="muted small">${esc(desc)}</p>` : ""}
    <div><label class="lab" for="mi">${esc(label)}</label><input id="mi" name="mi" type="${type}" ${inputmode ? `inputmode="${inputmode}"` : ""} required readonly autocomplete="${type === "password" ? "new-password" : "off"}"></div>
    <p class="err" id="merr" role="alert"></p>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="mc">취소</button><button class="btn primary" id="ms">${esc(submit)}</button></div>
  </form></div>`;
  const close = () => { layer.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  $("#mc").onclick = close;
  $("#ovl").addEventListener("mousedown", (e) => { if (e.target.id === "ovl") close(); });
  const inp = $("#mi"); let typed = false;
  inp.addEventListener("focus", () => inp.removeAttribute("readonly"));   /* 읽기 전용으로 시작해 브라우저 자동 입력을 막고, 칸을 누르면 풀립니다 */
  inp.addEventListener("input", () => { typed = true; });
  [150, 500, 1200].forEach((ms) => setTimeout(() => { if (!typed && inp.value) inp.value = ""; }, ms));   /* 혹시 들어온 자동 입력값 지우기 */
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); $("#mf").requestSubmit(); } });   /* 엔터키로 확인 */
  setTimeout(() => inp.focus(), 30);
  $("#mf").onsubmit = async (e) => {
    e.preventDefault();
    const btn = $("#ms"); if (btn.disabled) return; btn.disabled = true; $("#merr").textContent = "";
    try { await onSubmit($("#mi").value.trim()); close(); }
    catch (err) { $("#merr").textContent = err.message; btn.disabled = false; $("#mi").select(); }
  };
}

/* ===== 헤더 ===== */
function renderHeader() {
  const right = [];
  if (S.auth && S.data) right.push(`<span class="who">${esc(S.data.me.team)} · ${esc(S.data.me.name)}</span><button class="hbtn" data-act="logout">나가기</button>`);
  right.push(`<button class="hbtn" data-act="prof" aria-pressed="${S.view === "prof"}">교수자 메뉴</button>`);
  $("#hdrRight").innerHTML = right.join("");
  $("#crumb").textContent = S.view === "prof" ? "교수자 메뉴" : S.view === "projects" ? "프로젝트 상호평가" : "프로젝트 01 · 학과 홍보 영상 제작";
}

/* ===== 화면 전환 ===== */
function render() {
  renderHeader();
  const v = { projects: viewProjects, pick: viewPick, main: viewMain, prof: viewProf }[S.view];
  $("#app").innerHTML = v();
  window.scrollTo(0, 0);
  if (S.view === "pick") { const q = $("#q"); if (q) q.addEventListener("input", filterNames); }
  if (S.view === "main" && S.tab === "feedback" && !S.form) loadFeedback();
}

function viewProjects() {

/* ===== 학생 메인 ===== */
function done(key) { return !!(S.data.mine && S.data.mine[key]); }
function counts() {
  const d = S.data, others = d.teams.filter((t) => !t.mine);
  return {
    cross: [others.filter((t) => done("cross|" + t.name)).length, others.length],
    self: [done("self|" + d.me.team) ? 1 : 0, 1],
    peer: [d.teammates.filter((m) => done("peer|" + m.id)).length, d.teammates.length]
  };
}
function videoBtns(t) {
  const mk = (u, l) => { const h = safeUrl(u); return h ? `<a class="btn small" href="${esc(h)}" target="_blank" rel="noopener noreferrer">▶ ${l} 영상</a>` : `<span class="btn small off" aria-disabled="true">${l} 주소 없음</span>`; };
  return `<div class="row" style="gap:8px">${mk(t.long, "롱폼")}${mk(t.short, "숏폼")}</div>`;
}
function statusBadge(key) { return done(key) ? `<span class="badge ok">제출 완료</span>` : `<span class="badge warn">미제출</span>`; }

function viewMain() {

  if (S.tab === "cross") {

    body = others.length ? `<div class="stack">${others.map((t) => `<div class="card stack"><div class="row between"><h3>${esc(t.name)}</h3>${statusBadge("cross|" + t.name)}</div>${videoBtns(t)}<div><button class="btn primary" data-act="form" data-type="cross" data-target="${esc(t.name)}">${done("cross|" + t.name) ? "평가 수정하기" : "평가하기"}</button></div></div>`).join("")}</div>` : `<div class="notice">평가할 다른 팀이 없습니다.</div>`;
  } else if (S.tab === "self") {
    const t = d.teams.find((x) => x.mine);
    body = `<div class="card stack"><div class="row between"><h3>${esc(t.name)} (우리 팀)</h3>${statusBadge("self|" + t.name)}</div><p class="muted small">우리 팀의 영상과 나의 참여를 스스로 돌아봅니다. 이 평가는 다른 사람에게 공개되지 않습니다.</p>${videoBtns(t)}<div><button class="btn primary" data-act="form" data-type="self" data-target="${esc(t.name)}">${done("self|" + t.name) ? "평가 수정하기" : "평가하기"}</button></div></div>`;
  } else if (S.tab === "peer") {
    body = d.teammates.length ? `<div class="stack"><p class="muted small">팀원 평가는 서로에게 공개되지 않습니다. 솔직하게 작성해 주세요.</p>${d.teammates.map((m) => `<div class="card row between"><div class="row"><h3>${esc(m.name)}</h3>${statusBadge("peer|" + m.id)}</div><button class="btn primary" data-act="form" data-type="peer" data-target="${m.id}" data-label="${esc(m.name)}">${done("peer|" + m.id) ? "평가 수정하기" : "평가하기"}</button></div>`).join("")}</div>` : `<div class="notice">같은 팀의 다른 팀원이 없습니다.</div>`;
  } else {
    body = viewFeedback();
  }

    <div class="prog" aria-label="평가 진행 상황"><div><b class="num">${c.cross[0]}/${c.cross[1]}</b><span>다른 팀 평가</span></div><div><b class="num">${c.self[0]}/1</b><span>우리 팀 자기 평가</span></div><div><b class="num">${c.peer[0]}/${c.peer[1]}</b><span>팀 내 상호 평가</span></div></div>
    <div><div class="tabs" role="tablist">${tabs.map(([k, l, n]) => `<button class="tab" role="tab" aria-selected="${S.tab === k}" data-act="tab" data-tab="${k}">${l}${n ? `<span class="cnt num">${n}</span>` : ""}</button>`).join("")}</div>${body}</div></div>`;
}

/* ===== 평가 양식 ===== */
function formHtml(type, ctx) {
  const f = FORMS[type], pre = ctx.prefill || {}, min = ctx.min || 10;
  const items = f.items.map((t, i) => `<fieldset class="q" data-q="${i}"><legend>${i + 1}. ${esc(t)}</legend><div class="scale">${[1, 2, 3, 4, 5].map((n) => `<label><input type="radio" name="q${i}" value="${n}" ${pre.scores && pre.scores[i] === n ? "checked" : ""}><span>${n}</span></label>`).join("")}</div><div class="ends"><span>1 아쉬움</span><span>5 매우 우수</span></div></fieldset>`).join("");
  const cm = (k, v) => `<div class="cmt" data-c="${k}"><label class="lab" for="${k}">${esc(f[k].label)} <span class="badge warn">필수</span></label><textarea id="${k}" placeholder="${esc(f[k].ph)}" maxlength="1000">${esc(v || "")}</textarea><div class="count num" data-count="${k}">0자 · ${min}자 이상</div></div>`;
  return `<form id="evalForm" class="stack" data-type="${type}" data-min="${min}" novalidate>
    <div class="card stack"><p class="muted small">1점은 아쉬움, 5점은 매우 우수입니다. 점수와 주관식 의견은 모두 필수입니다.</p>${items}</div>
    <div class="card stack">${cm("c1", pre.c1)}${cm("c2", pre.c2)}</div>
    <p class="err" id="ferr" role="alert"></p>
    <div class="row"><button class="btn primary" type="submit">${ctx.submitLabel || "제출하기"}</button><button type="button" class="btn" data-act="${ctx.cancelAct}">취소</button></div></form>`;
}
function readForm() {
  const form = $("#evalForm"), type = form.dataset.type, n = FORMS[type].items.length, min = Number(form.dataset.min);
  const scores = []; let bad = false;
  for (let i = 0; i < n; i++) {
    const r = form.querySelector(`input[name="q${i}"]:checked`);
    scores.push(r ? Number(r.value) : null);
    form.querySelector(`[data-q="${i}"]`).classList.toggle("missing", !r); if (!r) bad = true;
  }
  const c1 = $("#c1").value.trim(), c2 = $("#c2").value.trim();
  [["c1", c1], ["c2", c2]].forEach(([k, v]) => { const short = v.length < min; form.querySelector(`[data-c="${k}"]`).classList.toggle("missing", short); if (short) bad = true; });
  if (bad) { $("#ferr").textContent = `빠진 항목이 있습니다. 모든 점수를 선택하고, 주관식 의견을 각각 ${min}자 이상 작성해 주세요.`; const m = form.querySelector(".missing"); if (m) m.scrollIntoView({ block: "center", behavior: "smooth" }); return null; }
  $("#ferr").textContent = ""; return { scores, c1, c2 };
}
function bindForm(onSubmit) {
  const form = $("#evalForm"); if (!form) return;
  const min = Number(form.dataset.min);
  const upd = (k) => { const l = $(`#${k}`).value.trim().length; const el = form.querySelector(`[data-count="${k}"]`); el.textContent = `${l}자 · ${min}자 이상`; el.classList.toggle("ok", l >= min); };
  ["c1", "c2"].forEach((k) => { upd(k); $(`#${k}`).addEventListener("input", () => upd(k)); });
  form.addEventListener("submit", async (e) => {
    e.preventDefault(); const v = readForm(); if (!v) return;
    const btn = form.querySelector("button[type=submit]"); btn.disabled = true;
    try { await onSubmit(v); } catch (err) { $("#ferr").textContent = err.message; btn.disabled = false; }
  });
}
function viewForm() {
  const f = S.form, d = S.data, t = d.teams.find((x) => x.name === f.target);
  const title = f.type === "peer" ? `${f.label} 팀원 평가` : f.type === "self" ? "우리 팀 자기 평가" : `${f.target} 평가`;
  const showVideo = f.type !== "peer" && t;
  return `<div class="stack-lg"><div class="stack"><button class="back" data-act="form-cancel">← 목록으로</button><h1>${esc(title)}</h1>${showVideo ? videoBtns(t) : ""}</div>${formHtml(f.type, { prefill: d.mine[f.key], min: d.minComment, cancelAct: "form-cancel" })}</div>`;
}

/* ===== 피드백 보기 ===== */
function viewFeedback() {
  if (!S.data.feedbackOpen) return `<div class="card lock"><b>아직 공개되지 않았습니다</b><p class="muted">모든 평가가 끝난 뒤 교수자가 공개하면 이곳에서 볼 수 있습니다.</p></div>`;
  if (!S.fb) return `<p class="muted">불러오는 중입니다…</p>`;
  if (S.fb.error) return `<div class="notice">${esc(S.fb.error)}</div>`;
  const fb = S.fb, items = FORMS.cross.items;
  const valid = fb.items.filter((v) => v !== null);
  const overall = valid.length ? valid.reduce((a, b) => a + b, 0) / valid.length : null;
  const fmt = (v) => (v === null ? "–" : v.toFixed(1));
  const bar = (label, v) => `<div class="bar"><span>${esc(label)}</span><span class="track"><span class="fill" style="width:${v === null ? 0 : (v / 5) * 100}%"></span></span><span class="val num">${fmt(v)}</span></div>`;
  const prof = fb.prof ? `<div class="card stack"><div class="row between"><h3>교수 평가</h3><span class="badge">${fb.prof.scores.length ? (fb.prof.scores.reduce((a, b) => a + b, 0) / fb.prof.scores.length).toFixed(1) + "점 평균" : ""}</span></div>${items.map((t, i) => bar(t, fb.prof.scores[i])).join("")}<div class="stack"><div><b class="small muted">${esc(FORMS.cross.c1.label)}</b><div class="quote">${esc(fb.prof.c1)}</div></div><div><b class="small muted">${esc(FORMS.cross.c2.label)}</b><div class="quote">${esc(fb.prof.c2)}</div></div></div></div>` : "";
  return `<div class="stack-lg">
    <div class="card stack"><div class="row between"><div><h3>${esc(fb.team)}이(가) 다른 팀에게 받은 평가</h3><p class="muted small">평가자 ${fb.count}명 · 평가자 이름은 공개되지 않습니다.</p></div><div><span class="big num">${fmt(overall)}</span><span class="muted"> / 5</span></div></div>
    ${fb.count ? items.map((t, i) => bar(t, fb.items[i])).join("") : `<p class="muted">아직 받은 평가가 없습니다.</p>`}</div>
    ${fb.comments.length ? `<div class="stack"><h2>주관식 의견</h2>${fb.comments.map((c, i) => `<div class="card stack"><b class="small muted">평가자 ${i + 1}</b><div><b class="small muted">${esc(FORMS.cross.c1.label)}</b><div class="quote">${esc(c.c1)}</div></div><div><b class="small muted">${esc(FORMS.cross.c2.label)}</b><div class="quote">${esc(c.c2)}</div></div></div>`).join("")}</div>` : ""}
    ${prof}
    <p class="muted small">자기 평가와 팀 내 상호 평가는 이곳에 표시되지 않습니다.</p></div>`;
}
async function loadFeedback() {
  S.fb = null;
  try { const st = await api("state", sAuth()); S.data = st; } catch (e) { /* 아래에서 처리 */ }
  if (!S.data.feedbackOpen) { reRenderKeepTab(); return; }
  try { S.fb = await api("feedback", sAuth()); } catch (e) { S.fb = { error: e.message }; }
  reRenderKeepTab();
}
function reRenderKeepTab() { if (S.view === "main" && S.tab === "feedback" && !S.form) { const y = window.scrollY; renderHeader(); $("#app").innerHTML = viewMain(); window.scrollTo(0, y); } }

    body = `<div class="stack-lg"><div class="card tbl-wrap"><table><thead><tr><th>팀</th><th>받은 평가(학생)</th><th>교수 평가</th></tr></thead><tbody>${d.teams.map((t) => `<tr><td><b>${esc(t.name)}</b></td><td class="num">${t.received}명</td><td>${t.profDone ? "완료" : "–"}</td></tr>`).join("")}</tbody></table></div>
    <div class="card tbl-wrap"><table><thead><tr><th>학생</th><th>팀</th><th>다른 팀</th><th>자기</th><th>팀 내</th></tr></thead><tbody>${d.students.map((s) => { const ok = s.cross >= s.needCross && s.self >= 1 && s.peer >= s.needPeer; return `<tr><td>${esc(s.name)} ${ok ? `<span class="badge ok">완료</span>` : ""}</td><td>${esc(s.team)}</td><td class="num">${s.cross}/${s.needCross}</td><td class="num">${s.self}/1</td><td class="num">${s.peer}/${s.needPeer}</td></tr>`; }).join("")}</tbody></table></div>
    <div><button class="btn" data-act="refresh-prof">새로고침</button></div></div>`;
  } else {
    body = `<div class="stack"><p class="muted small">한 줄에 한 명씩 <b>이름, 학번, 팀명</b>을 쉼표나 탭으로 구분해 붙여 넣으세요. 엑셀에서 복사해도 됩니다. 등록하면 기존 명단이 바뀌고, 이미 제출된 평가는 그대로 남습니다.</p>
    <div class="card stack"><textarea id="rosterText" style="min-height:220px" placeholder="이름,학번,팀명&#10;김민성,202206003,01팀" spellcheck="false"></textarea><div class="row"><label class="btn" for="rosterFile">파일 불러오기 (csv·txt)</label><input type="file" id="rosterFile" accept=".csv,.txt,text/plain,text/csv" hidden><span class="muted small">현재 ${d.rosterCount}명 등록됨</span></div><p class="err" id="rerr" role="alert"></p><div><button class="btn primary" data-act="save-roster">명단 등록</button></div></div></div>`;
  }
  return `<div class="stack-lg"><div class="row between"><h1>교수자 메뉴</h1><button class="btn" data-act="prof-close">닫기</button></div>
    ${P.form ? "" : `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${P.tab === k}" data-act="ptab" data-tab="${k}">${l}</button>`).join("")}</div>`}${body}</div>`;
}
function openProf() {
  if (S.prof.pw && S.prof.data) { S.prevView = S.view === "prof" ? S.prevView : S.view; S.view = "prof"; render(); return; }
  modal({ title: "교수자 메뉴", desc: "교수자 비밀번호를 입력하세요.", label: "비밀번호", onSubmit: async (v) => {
    S.prof.data = await api("prof_state", { ppw: v }); S.prof.pw = v;
    S.prevView = S.view; S.view = "prof"; S.prof.tab = S.prof.data.rosterCount ? "urls" : "roster"; render();
  } });
}
async function refreshProf(keep = true) { S.prof.data = await api("prof_state", { ppw: S.prof.pw }); if (S.view === "prof") { const y = window.scrollY; render(); if (keep) window.scrollTo(0, y); } }

async function loadScore() {
  S.prof.exp = await api("prof_export", { ppw: S.prof.pw });
  if (S.view === "prof" && S.prof.tab === "score") { const y = window.scrollY; render(); window.scrollTo(0, y); }
}
function loadXlsxLib() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, no) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = ok; s.onerror = () => no(new Error("엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."));
    document.head.appendChild(s);
  });
}
async function downloadXlsx() {
  await loadScore();
  await loadXlsxLib();
  const x = S.prof.exp, nameBySid = {};
  x.roster.forEach((r) => { nameBySid[r.sid] = r.name; });
  const avg = (a) => a.length ? Math.round(a.reduce((p, v) => p + v, 0) / a.length * 100) / 100 : "";
  const wS = Math.round(x.weights.student * 100), wP = Math.round(x.weights.prof * 100);
  const wb = XLSX.utils.book_new();
  const add = (name, rows, widths) => { const ws = XLSX.utils.aoa_to_sheet(rows); ws["!cols"] = widths.map((w) => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, name); };

  add("최종 점수", [["순위", "팀", "팀원", "평가한 학생 수", `학생 평가(100점)`, `교수 평가(100점)`, `최종 점수 (학생 ${wS}% + 교수 ${wP}%)`]]
    .concat(x.board.map((b) => [b.rank ?? "", b.team, b.members.join(", "), b.evaluators, b.student ?? "", b.prof ?? "", b.final ?? ""]))
    .concat([[], [`※ 학생 평가 = 다른 팀 학생이 준 점수(6개 항목 평균)의 평균 ÷ 5 × 100`], [`※ 교수 평가 = 6개 항목 평균 ÷ 5 × 100`], [`※ 자기 평가와 팀 내 상호 평가는 팀 점수에 반영하지 않습니다.`]]),
    [6, 10, 22, 14, 16, 16, 28]);

  const head = (type, extra) => extra.concat(FORMS[type].items.map((t, i) => `${i + 1}. ${t}`), ["항목 평균", FORMS[type].c1.label, FORMS[type].c2.label]);
  const sheet = (type, extraHead, rowFn) => {
    const list = x.evals.filter((e) => e.type === type).map(rowFn);
    return [head(type, extraHead)].concat(list);
  };
  const wid = (n) => [12, 12, 10, 10].concat(Array(n).fill(14), [10, 40, 40]);
  const rowOf = (extra, e) => extra.concat(e.scores, [avg(e.scores), e.c1, e.c2]);

  add("다른 팀 평가", sheet("cross", ["평가자 학번", "평가자 이름", "평가자 팀", "대상 팀"], (e) => rowOf([e.sid, e.name, e.team, e.targetTeam], e)), wid(6));
  add("교수 평가", sheet("prof", ["대상 팀"], (e) => rowOf([e.targetTeam], e)), [10].concat(Array(6).fill(14), [10, 40, 40]));
  add("자기 평가", sheet("self", ["평가자 학번", "평가자 이름", "팀"], (e) => rowOf([e.sid, e.name, e.team], e)), [12, 12, 10].concat(Array(6).fill(14), [10, 40, 40]));
  add("팀 내 상호 평가", sheet("peer", ["평가자 학번", "평가자 이름", "팀", "평가 대상 학번", "평가 대상 이름"], (e) => rowOf([e.sid, e.name, e.team, e.targetSid, nameBySid[e.targetSid] || ""], e)), [12, 12, 10, 14, 14].concat(Array(5).fill(14), [10, 40, 40]));

  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  XLSX.writeFile(wb, `프로젝트01_상호평가_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.xlsx`);
  toast("엑셀 파일을 내려받았습니다.");
}

/* ===== 이벤트 ===== */
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]"); if (!el || el.tagName === "INPUT") return;
  const a = el.dataset.act;
  try {
    if (a === "prof") return openProf();
    if (a === "prof-close") { S.view = S.prevView || "projects"; if (S.view === "main" && !S.data) S.view = "projects"; return render(); }
    if (a === "open-proj") return modal({ title: "프로젝트 01", desc: "교수자가 알려준 비밀번호를 입력하세요.", label: "프로젝트 비밀번호", onSubmit: async (v) => { const r = await api("enter", { pw: v }); S.pw = v; S.students = r.students; S.view = "pick"; render(); } });
    if (a === "to-projects") { S.view = "projects"; return render(); }
    if (a === "pick") { const id = Number(el.dataset.id), name = el.dataset.name;
      return modal({ title: `${name}님, 학번을 입력하세요`, desc: "학번이 비밀번호입니다.", label: "학번", inputmode: "numeric", submit: "입장", onSubmit: async (v) => {
        S.data = await api("login", { pw: S.pw, id, sid: v }); S.auth = { id, sid: v }; store("auth", JSON.stringify({ pw: S.pw, id, sid: v }));
        S.view = "main"; S.tab = "cross"; S.form = null; S.fb = null; render(); } }); }
    if (a === "logout") { S.auth = null; S.data = null; S.form = null; S.fb = null; store("auth", null); try { S.students = (await api("enter", { pw: S.pw })).students; } catch (e2) { /* 목록은 다시 입장할 때 불러옵니다 */ } S.view = "pick"; return render(); }
    if (a === "tab") { S.tab = el.dataset.tab; S.fb = null; if (S.tab !== "feedback") { try { S.data = await api("state", sAuth()); } catch (err) { /* 이전 상태 유지 */ } } return render(); }
    if (a === "form") { const type = el.dataset.type, target = el.dataset.target; S.form = { type, target, label: el.dataset.label || "", key: type === "self" ? "self|" + target : type + "|" + target }; render(); return bindForm(async (v) => {
      await api("submit", { ...sAuth(), type, target, ...v }); S.data = await api("state", sAuth()); S.form = null; render(); toast("평가를 제출했습니다."); }); }
    if (a === "form-cancel") { S.form = null; return render(); }

    /* 교수자 */
    if (a === "ptab") { S.prof.tab = el.dataset.tab; S.prof.form = null; S.prof.exp = null; await refreshProf(false); if (S.prof.tab === "score") await loadScore(); return; }
    if (a === "refresh-score") { await loadScore(); return toast("새로고침했습니다."); }
    if (a === "xlsx") { el.disabled = true; try { await downloadXlsx(); } finally { el.disabled = false; } return; }
    if (a === "refresh-prof") { await refreshProf(); return toast("새로고침했습니다."); }
    if (a === "save-url") { const tr = el.closest("tr"); await api("prof_set_urls", { ppw: S.prof.pw, team: el.dataset.team, long: tr.querySelector('[data-f="long"]').value.trim(), short: tr.querySelector('[data-f="short"]').value.trim() }); const y = window.scrollY; S.prof.data = await api("prof_state", { ppw: S.prof.pw }); render(); window.scrollTo(0, y); return toast(`${el.dataset.team} 영상 주소를 저장했습니다.`); }
    if (a === "pform") { S.prof.form = { team: el.dataset.team }; render(); return bindForm(async (v) => { await api("prof_submit", { ppw: S.prof.pw, team: S.prof.form.team, ...v }); S.prof.form = null; await refreshProf(false); toast("교수 평가를 저장했습니다."); }); }
    if (a === "pform-cancel") { S.prof.form = null; return render(); }
    if (a === "save-roster") { const text = $("#rosterText").value; $("#rerr").textContent = ""; try { const r = await api("prof_set_roster", { ppw: S.prof.pw, text }); if (S.pw) { try { S.students = (await api("enter", { pw: S.pw })).students; } catch (e2) { /* 다음 입장 때 갱신 */ } } await refreshProf(false); toast(`${r.count}명, ${r.teams}개 팀을 등록했습니다.`); } catch (err) { $("#rerr").textContent = err.message; } return; }
  } catch (err) { toast(err.message); }
});
document.addEventListener("change", async (e) => {
  const el = e.target;
  try {
    if (el.id === "fbOpen" || el.id === "incProf") {
      const r = await api("prof_set_feedback", { ppw: S.prof.pw, open: $("#fbOpen").checked, includeProf: $("#incProf").checked });
      S.prof.data.feedbackOpen = r.feedbackOpen; S.prof.data.includeProf = r.includeProf;
      $("#fbState").textContent = r.feedbackOpen ? "피드백 공개 중" : "피드백 비공개";
      toast(r.feedbackOpen ? "피드백을 공개했습니다." : "피드백을 비공개로 바꿨습니다.");
    }
    if (el.id === "rosterFile" && el.files[0]) { $("#rosterText").value = await el.files[0].text(); }
  } catch (err) { toast(err.message); if (el.id === "fbOpen") el.checked = !el.checked; }
});

/* ===== 시작 ===== */
(async function init() {
  render();
  const saved = store("auth"); if (!saved || !API_URL) return;
  try {
    const a = JSON.parse(saved);
    S.pw = a.pw; S.data = await api("login", a); S.auth = { id: a.id, sid: a.sid }; S.view = "main"; render();
  } catch (e) { store("auth", null); S.data = null; S.auth = null; render(); }
})();
</script>
</body>
</html>
